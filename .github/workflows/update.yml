name: Update and validate Nodi tap
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: nodi-tap-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      available: ${{ steps.sync.outputs.available }}
      version: ${{ steps.sync.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Consume only a confirmed stable release
        id: sync
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/update-formula.ps1
          $available = Test-Path ./Formula/nodi.rb
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($available) {
            $formulaVersion=[regex]::Match((Get-Content ./Formula/nodi.rb -Raw),'version "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
            "version=$formulaVersion" >> $env:GITHUB_OUTPUT
          }
          $changed = $false
          if ($available) {
            git add -- Formula
            $changed = -not [string]::IsNullOrWhiteSpace((git status --porcelain -- Formula | Out-String))
          }
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($changed) {
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'Update Nodi from confirmed release receipt'
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Tap push failed; no force update allowed.' }
          }
  install:
    needs: update
    if: needs.update.outputs.available == 'true' && (needs.update.outputs.changed == 'true' || github.event_name != 'schedule')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        upgrade_from: ['0.1.0', '0.2.1', '0.3.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MaximSavhenko/nodi
          ref: v${{ needs.update.outputs.version }}
          persist-credentials: false
      - name: Install published binary using the real Homebrew tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          EXPECTED_VERSION: ${{ needs.update.outputs.version }}
        run: |
          set -euo pipefail
          export NODI_CONFIG_DIR="$RUNNER_TEMP/nodi-preserved-config"
          mkdir -p "$NODI_CONFIG_DIR" "$RUNNER_TEMP/nodi-preserved-downloads"
          printf '{"repository":"owner/private"}\n' > "$NODI_CONFIG_DIR/config.json"
          printf 'fictional-upgrade-read' > "$NODI_CONFIG_DIR/read.credential"
          printf 'fictional-upgrade-write' > "$NODI_CONFIG_DIR/write.credential"
          chmod 700 "$NODI_CONFIG_DIR"
          chmod 600 "$NODI_CONFIG_DIR"/*
          printf 'recipient edits preserved\n' > "$RUNNER_TEMP/nodi-preserved-downloads/model.step"
          shasum -a 256 "$NODI_CONFIG_DIR"/* "$RUNNER_TEMP/nodi-preserved-downloads"/* > "$RUNNER_TEMP/state-before.sha256"
          brew tap MaximSavhenko/nodi
          tap_repo="$(brew --repo MaximSavhenko/nodi)"
          if [[ "$EXPECTED_VERSION" != '${{ matrix.upgrade_from }}' && "$EXPECTED_VERSION" != '0.1.0' ]]; then
            previous=d950532a5637bec4fae5e0f67d1b922d868cc4b8
            if [[ '${{ matrix.upgrade_from }}' == '0.2.1' ]]; then previous=b981726c0f7a5a5c44b6815c65b41b8301e3371c; fi
            if [[ '${{ matrix.upgrade_from }}' == '0.3.0' ]]; then previous=e7077665eff6c24e375a9fe88110e4592ae51f3b; fi
            git -C "$tap_repo" fetch origin "$previous"
            git -C "$tap_repo" checkout FETCH_HEAD
            brew install MaximSavhenko/nodi/nodi
            [[ "$(nodi version)" == 'nodi ${{ matrix.upgrade_from }} darwin/'* ]]
            git -C "$tap_repo" checkout main
            brew upgrade MaximSavhenko/nodi/nodi
          else
            brew install MaximSavhenko/nodi/nodi
          fi
          [[ "$(nodi version)" == "nodi $EXPECTED_VERSION darwin/"* ]]
          nodi version
          nodi help
          brew test MaximSavhenko/nodi/nodi
          shasum -a 256 --check "$RUNNER_TEMP/state-before.sha256"
          [[ "$(stat -f '%Lp' "$NODI_CONFIG_DIR/read.credential")" == '600' ]]
          [[ "$(stat -f '%Lp' "$NODI_CONFIG_DIR/write.credential")" == '600' ]]
          if [[ "$EXPECTED_VERSION" != '0.1.0' ]]; then
            [[ "$(nodi -v)" == "nodi $EXPECTED_VERSION darwin/"* ]]
            test -f "$(brew --prefix)/share/zsh/site-functions/_nodi"
            test -f "$(brew --prefix)/etc/bash_completion.d/nodi"
            python3 scripts/test-shell-completion.py "$(brew --prefix)/bin/nodi"
            python3 scripts/test-persistent-zsh.py "$(brew --prefix)/bin/nodi" --homebrew
          fi
          brew reinstall MaximSavhenko/nodi/nodi
          shasum -a 256 --check "$RUNNER_TEMP/state-before.sha256"
          brew upgrade MaximSavhenko/nodi/nodi
          brew uninstall MaximSavhenko/nodi/nodi
          hash -r
          test ! -e "$(brew --prefix)/bin/nodi"
          if command -v nodi; then echo 'Nodi remains after uninstall' >&2; exit 1; fi
